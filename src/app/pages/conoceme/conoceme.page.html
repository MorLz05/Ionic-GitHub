<ion-content [fullscreen]="true" class="neo-background">
  <div class="neo-container">

    <!-- Botón Regresar -->
    <div class="top-bar">
      <button class="neo-button back-btn" (click)="regresar()">
        <div class="icon-wrapper">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </div>
        <span>Regresar</span>
      </button>
    </div>

    <!-- 🔽 TABS de personas -->
    <div class="tabs-container">
      <button
        *ngFor="let p of personas"
        class="tab-btn"
        [class.active]="p.slug === personaActual.slug"
        (click)="cambiarPersona(p.slug)">
        {{ p.slug }}
      </button>
    </div>

    <!-- Tarjeta de presentación -->
    <div class="neo-card profile-card">
      <div class="avatar-circle">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <h2>{{ personaActual.nombre }}</h2>
      <p class="subtitle">{{ personaActual.rol }}</p>
    </div>

    <!-- Sección de datos académicos -->
    <div class="neo-card info-card">
      <div class="info-row">
        <div class="info-icon">
          <ion-icon name="school-outline"></ion-icon>
        </div>
        <div class="info-text">
          <span class="label">Grado y Grupo</span>
          <span class="value">{{ personaActual.grado }}</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon">
          <ion-icon name="book-outline"></ion-icon>
        </div>
        <div class="info-text">
          <span class="label">Carrera</span>
          <span class="value">{{ personaActual.carrera }}</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon">
          <ion-icon name="reader-outline"></ion-icon>
        </div>
        <div class="info-text">
          <span class="label">Materia</span>
          <span class="value">{{ personaActual.materia }}</span>
        </div>
      </div>
    </div>

    <!-- Sección de descripción -->
    <div class="neo-card description-card">
      <div class="description-header">
        <ion-icon name="information-circle-outline"></ion-icon>
        <h3>Descripción</h3>
      </div>
      <p class="description-text">{{ personaActual.descripcion }}</p>
    </div>

  </div>
</ion-content>
